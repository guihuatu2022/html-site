/* 预览画框 — 模拟装裱画心 */
.preview-frame {
  background: #fafaf7;
  border: 1px solid var(--line-color);
  border-radius: var(--radius-lg);
  position: relative;
  overflow: hidden;
  min-height: 300px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: inset 0 0 60px rgba(139,58,58,0.03);
}
.preview-frame::after {
  content: '';
  position: absolute;
  inset: 8px;
  border: 1px dashed rgba(220,211,178,0.5);
  border-radius: 1px;
  pointer-events: none;
  z-index: 1;
}
.preview-inner {
  position: relative;
  z-index: 2;
  padding: 2rem;
  text-align: center;
  width: 100%;
}
.preview-inner img {
  max-width: 100%;
  max-height: 420px;
  object-fit: contain;
  box-shadow: 2px 3px 12px rgba(0,0,0,0.12);
  background: #fff;
  padding: 6px;
}
.preview-inner video {
  max-width: 100%;
  max-height: 100%;
  width: 100%;
  height: 100%;
  object-fit: contain;
  border-radius: 2px;
  display: block;
  position: absolute;
  inset: 0;
}

/* 文件类型标签 */
.type-tabs {

/* 操作按钮区 */
.action-bar {

<script>
const sidebar = document.getElementById('sidebar');
const backdrop = document.getElementById('mobile-backdrop');

function toggleMobileMenu() {
  const isClosed = sidebar.classList.contains('-translate-x-full');
  if (isClosed) {
    backdrop.classList.remove('hidden');
    setTimeout(() => backdrop.classList.remove('opacity-0'), 10);
    sidebar.classList.remove('-translate-x-full');
  } else {
    backdrop.classList.add('opacity-0');
    sidebar.classList.add('-translate-x-full');
    setTimeout(() => backdrop.classList.add('hidden'), 300);
  }
}
</script>
<script>
(function(){
var p=new URLSearchParams(location.search);
var name=p.get('name')||'未知文件';
var size=p.get('size')||'未知';
var type=p.get('type')||'file';
var cat=p.get('cat')||'未分类';
var date=p.get('date')||'—';
var dl=p.get('dl')||'0';

document.title=name+' - 万卷藏书';
document.getElementById('hero-filename').textContent=name;
document.getElementById('info-name').textContent=name;
document.getElementById('info-size').textContent=size;
document.getElementById('info-cat').textContent=cat;
document.getElementById('info-date').textContent=date;
document.getElementById('info-dl').textContent=dl+' 次';
document.getElementById('download-size').textContent='('+size+')';

var typeMap={zip:{label:'压缩包',tag:'tag-red'},image:{label:'图片',tag:'tag-red'},video:{label:'视频',tag:'tag-red'},pdf:{label:'PDF',tag:'tag-red'},doc:{label:'文档',tag:'tag-red'},txt:{label:'文本',tag:'tag-red'}};
var t=typeMap[type];
if(t){document.getElementById('hero-type').textContent=t.label;document.getElementById('hero-type').className='tag '+t.tag}
else{document.getElementById('hero-type').textContent=type}

// Activate default tab in type-tabs
var tabs=document.querySelectorAll('.type-tab');
var activeTab=null;
tabs.forEach(function(tab){
  if(tab.getAttribute('data-type')===type){tab.classList.add('active');activeTab=tab}
});
if(!activeTab&&tabs.length){tabs[0].classList.add('active');activeTab=tabs[0]}

// Render preview
var previews={
  image:'<div class="preview-inner"><img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800" alt="preview"></div>',
  video:'<div class="preview-inner" style="padding:0"><video controls><source src="#" type="video/mp4">您的浏览器不支持视频预览</video></div>',
  pdf:'<div class="preview-inner"><div class="preview-empty"><i class="ph ph-file-text empty-icon-big"></i><span class="empty-title">PDF 文件建议下载后查看</span><span class="empty-hint">在线预览依赖浏览器支持</span></div></div>',
  doc:'<div class="preview-inner"><div class="preview-empty"><i class="ph ph-file-text empty-icon-big"></i><span class="empty-title">文档文件建议下载后查看</span><span class="empty-hint">不支持在线预览</span></div></div>',
  txt:'<div class="preview-inner"><div class="preview-empty"><i class="ph ph-file-text empty-icon-big"></i><span class="empty-title">文本文件 — 建议下载后用编辑器打开</span><span class="empty-hint">'+(size+(size.indexOf('KB')!==-1?'，内容较短':'，内容较大'))+'</span></div></div>',
  zip:'<div class="preview-inner"><div class="preview-empty"><i class="ph ph-file-zip empty-icon-big"></i><span class="empty-title">压缩文件 — 无法在线预览</span><span class="empty-hint">请下载后解压查看</span></div></div>'
};
var area=document.getElementById('preview-area');
if(previews[type]){area.innerHTML=previews[type]}
else{area.innerHTML='<div class="preview-inner"><div class="preview-empty"><i class="ph ph-file empty-icon-big"></i><span class="empty-title">'+name+'</span><span class="empty-hint">请下载后查看</span></div></div>'}

window.switchFilePreview=function(btn,sel){
  document.querySelectorAll('.type-tab').forEach(function(tb){tb.classList.remove('active')});
  btn.classList.add('active');
  if(previews[sel]){area.innerHTML=previews[sel]}
};
})();
</script>
